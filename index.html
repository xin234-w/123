<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <div class="container mx-auto px-4 py-16">
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-6xl font-bold text-white mb-6">
                📚 课程学习平台
            </h1>
            <p class="text-xl text-white/90 max-w-2xl mx-auto">
                选择你想学习的内容，开始你的学习之旅！
            </p>
        </div>

        <div class="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
            <!-- 个人课程展示 -->
            <a href="showcase/" class="card-hover bg-white rounded-2xl p-8 shadow-xl block">
                <div class="text-center">
                    <div class="w-24 h-24 bg-gradient-to-r from-blue-500 to-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="text-5xl">🎓</span>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-3">
                        个人课程展示
                    </h2>
                    <p class="text-gray-600 mb-6">
                        我的个人课程学习展示页面<br>
                        包含Python基础、数据分析技术、数据采集与处理等课程
                    </p>
                    <div class="inline-flex items-center text-blue-600 font-semibold">
                        <span>点击进入</span>
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Python数据分析全栈学习包 -->
            <a href="data-analysis/" class="card-hover bg-white rounded-2xl p-8 shadow-xl block">
                <div class="text-center">
                    <div class="w-24 h-24 bg-gradient-to-r from-green-500 to-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="text-5xl">🐍</span>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-3">
                        Python数据分析全栈学习包
                    </h2>
                    <p class="text-gray-600 mb-6">
                        完整的Python数据分析学习资源<br>
                        包含思维模型、专家争议、实操项目等内容
                    </p>
                    <div class="inline-flex items-center text-green-600 font-semibold">
                        <span>点击进入</span>
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                    </div>
                </div>
            </a>
        </div>

        <div class="text-center mt-16">
            <p class="text-white/70">
                💡 两个学习内容可以自由切换，互不影响
            </p>
        </div>
    </div>
</body>
</html>
